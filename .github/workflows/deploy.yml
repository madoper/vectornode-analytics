name: Deploy VectorNode Analytics

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # --- Analytics + Airflow ---
            cd /opt/analytics
            git pull origin main || true
            cp -r airflow/dags/* /opt/analytics/dags/ 2>/dev/null || true
            systemctl restart airflow-scheduler airflow-webserver

            # --- Dashboard (Streamlit) ---
            cd /opt/analytics/dashboard
            kill -9 $$(ps aux | grep 'streamlit run' | grep -v grep | awk '{print $$2}') 2>/dev/null || true
            sleep 2
            setsid /opt/analytics/venv/bin/streamlit run app.py \
              --server.port 8501 --server.address 127.0.0.1 --server.headless true &
            sleep 4
            curl -sf -o /dev/null http://127.0.0.1:8501 || echo "WARN: Streamlit check failed"

            # --- RAG Stack ---
            cd /opt/vectornode-analytics
            git pull origin main || true
            docker compose -f src/docker-compose.yml up -d --build --wait --wait-timeout 120 2>&1 || true
            curl -sf -o /dev/null http://127.0.0.1:8000/api/v1/health || echo "WARN: Gateway check failed"

            # --- Nginx ---
            nginx -t && systemctl reload nginx

            echo "DEPLOY COMPLETE"
