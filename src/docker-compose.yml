name: podft-rag

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: podft-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - podft_qdrant_data:/qdrant/storage
    environment:
      QDRANT__STORAGE__OPTIMIZERS__INDEXING_THRESHOLD_KB: 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - podft-net

  minio:
    image: minio/minio:latest
    container_name: podft-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: podft-minio
      MINIO_ROOT_PASSWORD: podft-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - podft_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - podft-net

  redis:
    image: redis:7-alpine
    container_name: podft-redis
    ports:
      - "6379:6379"
    volumes:
      - podft_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - podft-net

  embedding:
    build:
      context: ./src/embedding
      dockerfile: Dockerfile
    container_name: podft-embedding
    ports:
      - "5100:5100"
    environment:
      MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      DEVICE: cpu
    restart: unless-stopped
    networks:
      - podft-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  telegram-bot:
    build:
      context: ./src/telegram-bot
      dockerfile: Dockerfile
    container_name: podft-telegram-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      GATEWAY_URL: http://gateway:8000
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - podft-net

volumes:
  podft_qdrant_data:
    external: true
  podft_minio_data:
    external: true
  podft_redis_data:
    external: true

networks:
  podft-net:
    external: true
    name: podft_podft-net
